<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <style>
        @page {
            size: 14cm 21cm;
            margin: 2.5cm 1.5cm;

            @bottom-center {
                content: "\2014\2002" counter(page) "\2002\2014";
                font-family: "Garamond", serif;
                font-size: 11pt;
            }
        }

        @page doc-cover {
            @bottom-center {
                content: "";
            }
        }

        body {
            margin: 0;
            font-family: "Garamond", serif;
        }

        [hidden] {
            display: none;
        }

        .doc-meta {
            font-size: 11pt;
            font-style: italic;
            white-space: nowrap;
        }

        .doc-title {
            font-size: 18pt;
            font-variant-caps: small-caps;
            text-align: center;
        }

        .doc-cover {
            page: doc-cover;
            position: relative;
            height: 16cm;
            break-after: page;
        }

        .doc-cover .doc-meta {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .doc-cover .doc-title {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
        }

        .doc-header {
            margin-bottom: 36pt;
            text-align: center;
        }

        .doc-header .doc-meta {
            margin-bottom: 6pt;
        }

        .doc-pages {
            counter-reset: page 0;
        }

        .doc-toc {
            break-after: page;
        }

        .doc-toc-heading {
            margin-bottom: 36pt;
            font-size: 18pt;
            font-variant-caps: small-caps;
            text-align: center;
        }

        .doc-toc-entry {
            display: flex;
            align-items: baseline;
            gap: 0.15cm;
            font-size: 11pt;
        }

        .doc-toc-entry-title {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .doc-toc-entry-leader {
            flex: 1;
            border-bottom: 1pt solid transparent;
            opacity: 0.45;
        }

        .doc-toc-entry-page {
            font-variant-numeric: tabular-nums;
        }

        .doc-toc-level-2 {
            padding-left: 0.6cm;
        }

        .doc-toc-level-3 {
            padding-left: 1.2cm;
        }

        .doc-body p {
            margin: 0;
            margin-block: 0;
            font-size: 11pt;
            hyphens: auto;
            text-align: justify;
            text-indent: 0.7cm;
        }

        .doc-body[data-drop-cap="true"] p:not(p + p) {
            text-indent: 0;
        }

        .doc-body[data-drop-cap="true"] p:not(p + p)::first-letter {
            float: left;
            margin-right: 4pt;
            font-size: 36pt;
            line-height: 0.9;
        }

        .doc-body h1,
        .doc-body h2,
        .doc-body h3 {
            all: unset;
            display: block;
            text-align: center;
        }

        .doc-body h1 {
            margin-top: 64pt;
            margin-bottom: 36pt;
            break-before: page;
            font-size: 18pt;
            font-variant-caps: small-caps;
        }

        .doc-pages>.doc-body:first-child>h1:first-child {
            break-before: auto;
        }

        .doc-body h1:has(+ h2),
        .doc-body h1:has(+ h3) {
            margin-bottom: 6pt;
        }

        .doc-body h2 {
            margin-bottom: 36pt;
            font-size: 14pt;
        }

        .doc-body h2:not(h1 + h2):not(h2 + h2):not(h3 + h2),
        .doc-body h3:not(h1 + h3):not(h2 + h3):not(h3 + h3) {
            break-before: page;
        }

        .doc-body h2:has(+ h3) {
            margin-bottom: 6pt;
        }

        .doc-body h3 {
            margin-bottom: 36pt;
            font-size: 12pt;
        }

        .doc-body .stanza {
            margin-bottom: 16pt;
        }

        .doc-body .stanza p {
            padding-left: 1.2cm;
            text-indent: -1.2cm;
        }

        .doc-ruler {
            position: absolute;
            top: 0;
            left: 0;
            visibility: hidden;
            column-fill: auto;
            column-gap: 0;
        }

        .doc-ruler .doc-toc {
            break-after: column;
        }

        .doc-ruler .doc-body h1 {
            break-before: column;
        }

        .doc-ruler .doc-body h2:not(h1 + h2):not(h2 + h2):not(h3 + h2),
        .doc-ruler .doc-body h3:not(h1 + h3):not(h2 + h3):not(h3 + h3) {
            break-before: column;
        }

        .doc-ruler .doc-pages>.doc-body:first-child>h1:first-child {
            break-before: auto;
        }
    </style>
</head>

<body>
    <section class="doc-cover" id="doc-cover">
        <div class="doc-meta" id="doc-meta">
            <span id="doc-author" data-title-case>$author$</span>
            <span id="doc-meta-separator"> &ndash; </span>
            <span id="doc-date">$date$</span>
        </div>
        <div class="doc-title" id="doc-title" data-title-case>$title$</div>
    </section>

    <main class="doc-pages" id="doc-pages">
        <nav class="doc-toc" id="doc-toc" hidden>
            <div class="doc-toc-heading">Sumário</div>
        </nav>

        <div class="doc-body" id="doc-body">$body$</div>
    </main>

    <script>
        const docMetadata = {
            cover: "$cover$".trim().toLowerCase(),
            content: "$content$".trim().toLowerCase(),
            dropCap: "$dropCap$".trim().toLowerCase(),
        };
        const docPage = {
            width: "14cm",
            height: "21cm",
            marginTop: "2.5cm",
            marginRight: "1.5cm",
            marginBottom: "2.5cm",
            marginLeft: "1.5cm",
        };
        const trueValue = "true";

        const titleMinorWords = new Set([
            "a", "à", "às",
            "o", "os", "as",
            "ao", "aos",
            "de", "da", "das", "do", "dos",
            "e",
            "em", "no", "na", "nos", "nas",
            "por", "para", "pra", "pro", "pras", "pros",
            "com", "sem",
            "sob", "sobre",
            "até", "após",
            "ou"
        ]);

        const docCover = document.getElementById("doc-cover");
        const docMeta = document.getElementById("doc-meta");
        const docAuthor = document.getElementById("doc-author");
        const docMetaSeparator = document.getElementById("doc-meta-separator");
        const docDate = document.getElementById("doc-date");
        const docTitle = document.getElementById("doc-title");
        const docPages = document.getElementById("doc-pages");
        const docToc = document.getElementById("doc-toc");
        const docBody = document.getElementById("doc-body");

        function toTitleCase(text) {
            const words = text.trim().split(/\s+/).filter(Boolean);

            return words.map((word, index) => {
                const first = index === 0;
                const last = index === words.length - 1;
                const lower = word.toLocaleLowerCase("pt-BR");

                if (!first && !last && titleMinorWords.has(lower)) {
                    return lower;
                }

                return word.charAt(0).toLocaleUpperCase("pt-BR") + word.slice(1);
            }).join(" ");
        }

        function formatDocDate(text) {
            if (!/^\d{4}-\d{2}(-\d{2})?$/.test(text)) return text;

            const [year, month, day = 1] = text.split("-").map(Number);
            const date = new Date(year, month - 1, day);
            const options = day === 1 && text.length === 7
                ? { month: "long", year: "numeric" }
                : { day: "2-digit", month: "long", year: "numeric" };

            return date.toLocaleDateString("pt-BR", options);
        }

        function renderDocCover() {
            const title = docTitle.textContent.trim();
            const author = toTitleCase(docAuthor.textContent);
            const date = formatDocDate(docDate.textContent.trim());
            const hasCover = docMetadata.cover === trueValue;
            const hasHeading = !!author || !!date || !!title;

            if (!hasCover && !hasHeading) {
                docCover.remove();
                return;
            }

            if (!hasCover) {
                docCover.className = "doc-header";
                docPages.prepend(docCover);
            }

            docTitle.textContent = toTitleCase(title);
            docAuthor.textContent = author;
            docDate.textContent = date;

            docMeta.hidden = !author && !date;
            docAuthor.hidden = !author;
            docMetaSeparator.hidden = !author || !date;
            docDate.hidden = !date;
            docTitle.hidden = !title;
        }

        function applyDocTitleCase() {
            docBody.querySelectorAll("h1, h2, h3, [data-title-case]").forEach((element) => {
                element.textContent = toTitleCase(element.textContent);
            });
        }

        function applyDocDropCap() {
            docBody.dataset.dropCap = docMetadata.dropCap === trueValue;
        }

        function applyDocCurlyQuotes() {
            const walker = document.createTreeWalker(docBody, NodeFilter.SHOW_TEXT);
            const textNodes = [];
            let openDoubleQuote = true;
            let openSingleQuote = true;

            while (walker.nextNode()) {
                textNodes.push(walker.currentNode);
            }

            for (const node of textNodes) {
                node.nodeValue = node.nodeValue
                    .replace(/"/g, () => {
                        const quote = openDoubleQuote ? "\u201C" : "\u201D";
                        openDoubleQuote = !openDoubleQuote;
                        return quote;
                    })
                    .replace(/'/g, () => {
                        const quote = openSingleQuote ? "\u2018" : "\u2019";
                        openSingleQuote = !openSingleQuote;
                        return quote;
                    });
            }
        }

        function getDocPageRule() {
            for (const sheet of document.styleSheets) {
                for (const rule of sheet.cssRules) {
                    if (rule.type === window.CSSRule?.PAGE_RULE || rule.constructor.name === "CSSPageRule") {
                        return rule;
                    }
                }
            }

            return null;
        }

        function getDocPage() {
            const pageRule = getDocPageRule();
            if (!pageRule) return docPage;

            const [width, height = width] = pageRule.style.size.split(" ");

            return {
                width: width || docPage.width,
                height: height || docPage.height,
                marginTop: pageRule.style.marginTop || docPage.marginTop,
                marginRight: pageRule.style.marginRight || docPage.marginRight,
                marginBottom: pageRule.style.marginBottom || docPage.marginBottom,
                marginLeft: pageRule.style.marginLeft || docPage.marginLeft,
            };
        }

        function createDocRuler() {
            const page = getDocPage();
            const ruler = document.createElement("div");

            ruler.className = "doc-ruler";
            ruler.style.width = `calc(${page.width} - ${page.marginLeft} - ${page.marginRight})`;
            ruler.style.height = `calc(${page.height} - ${page.marginTop} - ${page.marginBottom})`;
            ruler.style.columnWidth = ruler.style.width;
            ruler.append(docPages.cloneNode(true));
            document.body.append(ruler);

            return ruler;
        }

        function fillDocTocPageNumbers() {
            const ruler = createDocRuler();
            if (!ruler) return;

            const rulerBox = ruler.getBoundingClientRect();
            const rulerHeadings = ruler.querySelectorAll(".doc-body h1, .doc-body h2, .doc-body h3");
            const tocPages = docToc.querySelectorAll(".doc-toc-entry-page");
            const docCoverPageOffset = docMetadata.cover === trueValue ? 1 : 0;

            rulerHeadings.forEach((heading, index) => {
                const headingBox = heading.getClientRects()[0] ?? heading.getBoundingClientRect();
                const pageOffset = Math.max(0, headingBox.left - rulerBox.left);
                const pageIndex = Math.floor((pageOffset + 0.5) / rulerBox.width);

                tocPages[index].textContent = pageIndex + 1 + docCoverPageOffset;
            });

            ruler.remove();
        }

        function renderDocToc() {
            const headings = [...docBody.querySelectorAll("h1, h2, h3")];

            if (docMetadata.content !== trueValue || !headings.length) {
                docToc.remove();
                return;
            }

            for (const heading of headings) {
                const entry = document.createElement("div");
                const title = document.createElement("span");
                const leader = document.createElement("span");
                const page = document.createElement("span");

                entry.className = `doc-toc-entry doc-toc-level-${heading.tagName[1]}`;
                title.className = "doc-toc-entry-title";
                leader.className = "doc-toc-entry-leader";
                page.className = "doc-toc-entry-page";

                title.textContent = heading.textContent;
                entry.append(title, leader, page);
                docToc.append(entry);
            }

            docToc.hidden = false;
            fillDocTocPageNumbers();
        }

        renderDocCover();
        applyDocDropCap();
        applyDocTitleCase();
        applyDocCurlyQuotes();
        renderDocToc();
    </script>
</body>

</html>
